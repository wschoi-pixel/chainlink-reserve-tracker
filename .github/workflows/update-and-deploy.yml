name: Update reserve data & deploy

on:
  push:
    branches: [main]
  schedule:
    # UTC: 00:17, 06:17, 12:17, 18:17 = KST 09:17, 15:17, 21:17, 03:17
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Refresh verified reserve data
        run: python scripts/update_data.py

      - name: Persist JSON snapshots to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Chainlink Reserve on-chain snapshot [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
